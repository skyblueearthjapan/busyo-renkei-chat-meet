<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メモを残す - 部署クイック連絡</title>
  <style><?!= include('ui/styles.css'); ?></style>
</head>
<body>
  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">読み込み中...</p>
  </div>

  <!-- トースト通知 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1 class="app-title">部署クイック連絡</h1>
    <div id="user-info" class="user-info"></div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="page page-memo">
      <div class="page-header">
        <button class="back-btn" onclick="App.navigateTo('home')">← 戻る</button>
        <h2 class="page-title">メモを残す</h2>
      </div>

      <form id="memo-form" class="memo-form">
        <input type="hidden" id="memo-event-id" name="related_event_id">

        <!-- 発信・宛先部署 -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">発信部署</label>
            <select id="memo-from-dept" name="from_dept_id" class="form-select">
              <option value="">選択してください</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">宛先部署</label>
            <select id="memo-to-dept" name="to_dept_id" class="form-select">
              <option value="">選択してください</option>
            </select>
          </div>
        </div>

        <!-- 問い合わせ種別 -->
        <div class="form-group">
          <label class="form-label">問い合わせ種別 <span class="required">*</span></label>
          <select id="memo-issue-type" name="issue_type" class="form-select" required>
            <option value="">選択してください</option>
          </select>
        </div>

        <!-- 要点 -->
        <div class="form-group">
          <label class="form-label">要点（短く） <span class="required">*</span></label>
          <input type="text" id="memo-summary" name="summary" class="form-input"
                 placeholder="何についての連絡ですか？" required maxlength="300">
          <div id="summary-counter" style="text-align:right; font-size:0.75rem; color:#6B7280; margin-top:4px;">0 / 300</div>
        </div>

        <!-- 決定事項/対応内容 -->
        <div class="form-group">
          <label class="form-label">決定事項/対応内容</label>
          <textarea id="memo-decisions" name="decisions" class="form-textarea"
                    placeholder="・箇条書きで記入&#10;・決まったこと、やること" rows="4"></textarea>
        </div>

        <!-- 担当者・期限 -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">担当者</label>
            <input type="text" id="memo-owner" name="owner" class="form-input"
                   placeholder="名前またはメール">
          </div>
          <div class="form-group">
            <label class="form-label">期限</label>
            <input type="date" id="memo-due-date" name="due_date" class="form-input">
          </div>
        </div>

        <!-- 結果・優先度・ステータス -->
        <div class="form-row three-col">
          <div class="form-group">
            <label class="form-label">結果</label>
            <select id="memo-outcome" name="outcome" class="form-select">
              <option value="">未選択</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">優先度</label>
            <select id="memo-priority" name="priority" class="form-select">
              <!-- 動的に設定 -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">ステータス</label>
            <select id="memo-status" name="status" class="form-select">
              <!-- 動的に設定 -->
            </select>
          </div>
        </div>

        <!-- 添付リンク -->
        <div class="form-group">
          <label class="form-label">添付リンク（Drive URL等）</label>
          <input type="url" id="memo-attachments" name="attachments" class="form-input"
                 placeholder="https://drive.google.com/...">
        </div>

        <!-- タグ -->
        <div class="form-group">
          <label class="form-label">タグ（任意）</label>
          <input type="text" id="memo-tags" name="tags" class="form-input"
                 placeholder="カンマ区切りで入力">
        </div>

        <!-- 備考 -->
        <div class="form-group">
          <label class="form-label">備考</label>
          <textarea id="memo-note" name="note" class="form-textarea"
                    placeholder="その他の情報" rows="2"></textarea>
        </div>

        <!-- 保存ボタン -->
        <button type="submit" class="btn btn-primary btn-large btn-save">
          保存する
        </button>
      </form>
    </div>
  </main>

  <!-- 下部タブナビゲーション -->
  <nav class="tab-nav">
    <button class="tab-btn" onclick="App.navigateTo('home')">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab-btn" onclick="App.navigateTo('history')">
      <span class="tab-icon">📋</span>
      <span class="tab-label">履歴</span>
    </button>
    <button class="tab-btn active" onclick="App.navigateTo('memo')">
      <span class="tab-icon">📝</span>
      <span class="tab-label">メモ</span>
    </button>
  </nav>

  <!-- Bootstrapデータ埋め込み -->
  <script>
    var BOOTSTRAP_DATA = <?!= bootstrapJson ?>;
    var INITIAL_PARAMS = <?!= initialParams ?>;
    var CURRENT_PAGE = '<?= currentPage ?>';
  </script>

  <?!= include('ui/app.js'); ?>

  <script>
  /**
   * Memo画面固有のロジック
   */
  var Memo = (function() {

    /**
     * 初期化
     */
    function init() {
      App.init({
        onReady: function() {
          setupForm();
          bindEvents();
        }
      });
    }

    /**
     * フォームを設定
     */
    function setupForm() {
      var params = App.getInitialParams();

      // 部署セレクトを設定
      App.populateDeptSelect('memo-from-dept', params.from || '');
      App.populateDeptSelect('memo-to-dept', params.to || '');

      // Lookupセレクトを設定
      App.populateLookupSelect('memo-issue-type', 'IssueType');
      App.populateLookupSelect('memo-outcome', 'Outcome');
      App.populateLookupSelect('memo-priority', 'Priority', '中');
      App.populateLookupSelect('memo-status', 'Status', 'Open');

      // パラメータから初期値を設定
      if (params.event_id) {
        document.getElementById('memo-event-id').value = params.event_id;
      }
    }

    /**
     * イベントバインド
     */
    function bindEvents() {
      // 要点の文字数カウンター
      var summaryInput = document.getElementById('memo-summary');
      var summaryCounter = document.getElementById('summary-counter');
      if (summaryInput && summaryCounter) {
        summaryInput.addEventListener('input', function() {
          var len = this.value.length;
          summaryCounter.textContent = len + ' / 300';
          if (len > 300) {
            summaryCounter.style.color = '#EF4444';
          } else {
            summaryCounter.style.color = '#6B7280';
          }
        });
      }

      // フォーム送信
      var form = document.getElementById('memo-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          saveMemo();
        });
      }
    }

    /**
     * メモを保存
     */
    function saveMemo() {
      var form = document.getElementById('memo-form');
      var formData = new FormData(form);
      var memoData = {};

      formData.forEach(function(value, key) {
        memoData[key] = value;
      });

      // クライアント側バリデーション（サーバー側でも実施）
      if (!memoData.issue_type) {
        App.showToast('問い合わせ種別を選択してください', 'error');
        return;
      }
      if (!memoData.summary || memoData.summary.trim() === '') {
        App.showToast('要点を入力してください', 'error');
        return;
      }
      if (memoData.summary.length > 300) {
        App.showToast('要点は300文字以内で入力してください', 'error');
        return;
      }

      App.showLoading('保存しています...');

      google.script.run
        .withSuccessHandler(function(result) {
          App.hideLoading();
          if (result.success) {
            App.showToast('保存しました', 'success');
            // 詳細ページへ遷移
            App.navigateTo('detail', { memo_id: result.memoId });
          } else {
            // バリデーションエラーの場合
            if (result.validationErrors) {
              App.showToast(result.error, 'error');
            } else {
              App.showToast(result.error || '保存に失敗しました', 'error');
            }
          }
        })
        .withFailureHandler(function(error) {
          App.hideLoading();
          App.showToast('エラーが発生しました。入力内容をコピーして保管してください。', 'error');
          console.error(error);
        })
        .createMemo(memoData);
    }

    return {
      init: init
    };
  })();

  // DOM読み込み完了後に初期化
  document.addEventListener('DOMContentLoaded', Memo.init);
  </script>
</body>
</html>
