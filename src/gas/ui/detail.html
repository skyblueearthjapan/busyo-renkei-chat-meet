<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メモ詳細 - 部署クイック連絡</title>
  <style><?!= include('ui/styles.css'); ?></style>
</head>
<body>
  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">読み込み中...</p>
  </div>

  <!-- トースト通知 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1 class="app-title">部署クイック連絡</h1>
    <div id="user-info" class="user-info"></div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="page page-detail">
      <div class="page-header">
        <button class="back-btn" onclick="App.navigateTo('history')">← 戻る</button>
        <h2 class="page-title">メモ詳細</h2>
      </div>

      <div id="memo-detail" class="memo-detail">
        <!-- 動的にメモ詳細が挿入される -->
      </div>
    </div>
  </main>

  <!-- 下部タブナビゲーション -->
  <nav class="tab-nav">
    <button class="tab-btn" onclick="App.navigateTo('home')">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab-btn" onclick="App.navigateTo('history')">
      <span class="tab-icon">📋</span>
      <span class="tab-label">履歴</span>
    </button>
    <button class="tab-btn" onclick="App.navigateTo('memo')">
      <span class="tab-icon">📝</span>
      <span class="tab-label">メモ</span>
    </button>
  </nav>

  <!-- Bootstrapデータ埋め込み -->
  <script>
    var BOOTSTRAP_DATA = <?!= bootstrapJson ?>;
    var INITIAL_PARAMS = <?!= initialParams ?>;
    var CURRENT_PAGE = '<?= currentPage ?>';
  </script>

  <?!= include('ui/app.js'); ?>

  <script>
  /**
   * Detail画面固有のロジック
   */
  var Detail = (function() {

    /**
     * 初期化
     */
    function init() {
      App.init({
        onReady: function() {
          loadMemoDetail();
        }
      });
    }

    /**
     * メモ詳細を読み込み
     */
    function loadMemoDetail() {
      var params = App.getInitialParams();
      var memoId = params.memo_id;

      if (!memoId) {
        App.showToast('メモIDが指定されていません', 'error');
        renderError('メモIDが指定されていません');
        return;
      }

      App.showLoading('詳細を読み込んでいます...');

      google.script.run
        .withSuccessHandler(function(result) {
          App.hideLoading();
          if (result.success) {
            renderMemoDetail(result.data);
          } else {
            App.showToast(result.error || 'メモの読み込みに失敗しました', 'error');
            renderError(result.error || 'メモの読み込みに失敗しました');
          }
        })
        .withFailureHandler(function(error) {
          App.hideLoading();
          App.showToast('エラーが発生しました', 'error');
          renderError('エラーが発生しました');
          console.error(error);
        })
        .getMemoDetail(memoId);
    }

    /**
     * エラー表示
     */
    function renderError(message) {
      var container = document.getElementById('memo-detail');
      if (container) {
        container.innerHTML = '<div class="empty-state">' +
          '<div class="empty-icon">⚠️</div>' +
          '<p class="empty-text">' + App.escapeHtml(message) + '</p>' +
          '</div>';
      }
    }

    /**
     * メモ詳細を描画
     */
    function renderMemoDetail(memo) {
      var container = document.getElementById('memo-detail');
      if (!container) return;

      var statusClass = App.getStatusClass(memo.status);

      var html =
        '<div class="detail-section">' +
          '<div class="memo-header">' +
            '<span class="memo-date">' + App.formatDate(memo.created_at) + '</span>' +
            '<span class="status-badge ' + statusClass + '">' + App.escapeHtml(memo.status) + '</span>' +
          '</div>' +
          '<div class="memo-route" style="margin-top:8px; font-size:1.1rem;">' +
            App.escapeHtml(memo.from_dept_name || '?') + ' → ' + App.escapeHtml(memo.to_dept_name || '?') +
          '</div>' +
        '</div>' +

        '<div class="detail-section">' +
          '<div class="detail-label">問い合わせ種別</div>' +
          '<div class="detail-value">' + App.escapeHtml(memo.issue_type || '-') + '</div>' +
        '</div>' +

        '<div class="detail-section">' +
          '<div class="detail-label">要点</div>' +
          '<div class="detail-value large">' + App.escapeHtml(memo.summary || '-') + '</div>' +
        '</div>';

      if (memo.decisions) {
        html +=
          '<div class="detail-section">' +
            '<div class="detail-label">決定事項/対応内容</div>' +
            '<div class="detail-value" style="white-space:pre-wrap;">' + App.escapeHtml(memo.decisions) + '</div>' +
          '</div>';
      }

      html +=
        '<div class="detail-section">' +
          '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">' +
            '<div>' +
              '<div class="detail-label">担当者</div>' +
              '<div class="detail-value">' + App.escapeHtml(memo.owner || '-') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="detail-label">期限</div>' +
              '<div class="detail-value">' + (memo.due_date ? App.formatDateOnly(memo.due_date) : '-') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="detail-section">' +
          '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">' +
            '<div>' +
              '<div class="detail-label">結果</div>' +
              '<div class="detail-value">' + App.escapeHtml(memo.outcome || '-') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="detail-label">優先度</div>' +
              '<div class="detail-value">' + App.escapeHtml(memo.priority || '-') + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="detail-label">作成者</div>' +
              '<div class="detail-value">' + App.escapeHtml(memo.creator_name || '-') + '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      if (memo.attachments) {
        html +=
          '<div class="detail-section">' +
            '<div class="detail-label">添付リンク</div>' +
            '<div class="detail-value">' +
              '<a href="' + App.escapeHtml(memo.attachments) + '" target="_blank" rel="noopener" style="color:#3B82F6;">' +
                '📎 添付ファイルを開く' +
              '</a>' +
            '</div>' +
          '</div>';
      }

      if (memo.tags) {
        html +=
          '<div class="detail-section">' +
            '<div class="detail-label">タグ</div>' +
            '<div class="detail-value">' + App.escapeHtml(memo.tags) + '</div>' +
          '</div>';
      }

      if (memo.note) {
        html +=
          '<div class="detail-section">' +
            '<div class="detail-label">備考</div>' +
            '<div class="detail-value" style="white-space:pre-wrap;">' + App.escapeHtml(memo.note) + '</div>' +
          '</div>';
      }

      if (memo.related_event_id) {
        html +=
          '<div class="detail-section">' +
            '<div class="detail-label">関連イベントID</div>' +
            '<div class="detail-value" style="font-size:0.875rem; color:#6B7280;">' + App.escapeHtml(memo.related_event_id) + '</div>' +
          '</div>';
      }

      // メモID表示
      html +=
        '<div class="detail-section" style="margin-top:24px; padding-top:16px; border-top:1px dashed #E5E7EB;">' +
          '<div style="font-size:0.75rem; color:#9CA3AF; text-align:center;">メモID: ' + App.escapeHtml(memo.memo_id) + '</div>' +
        '</div>';

      container.innerHTML = html;
    }

    return {
      init: init
    };
  })();

  // DOM読み込み完了後に初期化
  document.addEventListener('DOMContentLoaded', Detail.init);
  </script>
</body>
</html>
