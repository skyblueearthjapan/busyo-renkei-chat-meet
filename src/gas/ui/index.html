<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部署クイック連絡</title>
  <style><?!= include('ui/styles.css'); ?></style>
</head>
<body>
  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">読み込み中...</p>
  </div>

  <!-- トースト通知 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1 class="app-title">部署クイック連絡</h1>
    <div id="user-info" class="user-info"></div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="page page-home">
      <!-- 検索・フィルタ -->
      <div class="search-section">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="部署名で検索...">
        </div>
        <div id="filter-chips" class="filter-chips">
          <button class="chip active" data-site="">すべて</button>
          <!-- 拠点チップは動的に生成 -->
        </div>
      </div>

      <!-- 部署カードリスト -->
      <div id="dept-list" class="dept-list">
        <!-- 動的に部署カードが挿入される -->
      </div>
    </div>
  </main>

  <!-- 下部タブナビゲーション -->
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="App.navigateTo('home')">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">ホーム</span>
    </button>
    <button class="tab-btn" onclick="App.navigateTo('history')">
      <span class="tab-icon">📋</span>
      <span class="tab-label">履歴</span>
    </button>
    <button class="tab-btn" onclick="App.navigateTo('memo')">
      <span class="tab-icon">📝</span>
      <span class="tab-label">メモ</span>
    </button>
  </nav>

  <!-- Meet作成後のモーダル -->
  <div id="meet-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Meetを開始しました</h3>
      </div>
      <div class="modal-body">
        <p class="meet-info">
          <span id="meet-dept-name" class="meet-dept-name"></span> への連絡を開始しました。
        </p>
        <p class="meet-notice">新しいタブでMeetが開きます。</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="Home.closeMeetModal()">閉じる</button>
        <button class="btn btn-primary" onclick="Home.openMemoFromMeet()">メモを書く</button>
      </div>
    </div>
  </div>

  <!-- Bootstrapデータ埋め込み -->
  <script>
    var BOOTSTRAP_DATA = <?!= bootstrapJson ?>;
    var INITIAL_PARAMS = <?!= initialParams ?>;
    var CURRENT_PAGE = '<?= currentPage ?>';
  </script>

  <?!= include('ui/app.js'); ?>

  <script>
  /**
   * Home画面固有のロジック
   */
  var Home = (function() {
    var filters = {
      site: '',
      search: ''
    };
    var currentMeetData = null;

    /**
     * 初期化
     */
    function init() {
      App.init({
        onReady: function() {
          bindEvents();
          renderSiteChips();
          renderDeptList();
        }
      });
    }

    /**
     * イベントバインド
     */
    function bindEvents() {
      // 検索入力
      var searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', App.debounce(function() {
          filters.search = this.value.toLowerCase();
          renderDeptList();
        }, 300));
      }
    }

    /**
     * 拠点フィルタチップを描画
     */
    function renderSiteChips() {
      var depts = App.getDepts();
      var sites = [];
      depts.forEach(function(dept) {
        if (dept.site && sites.indexOf(dept.site) < 0) {
          sites.push(dept.site);
        }
      });

      var container = document.getElementById('filter-chips');
      if (!container) return;

      sites.forEach(function(site) {
        var chip = document.createElement('button');
        chip.className = 'chip';
        chip.setAttribute('data-site', site);
        chip.textContent = site;
        chip.addEventListener('click', function() {
          selectSiteChip(this);
        });
        container.appendChild(chip);
      });

      // 「すべて」チップのイベント
      var allChip = container.querySelector('[data-site=""]');
      if (allChip) {
        allChip.addEventListener('click', function() {
          selectSiteChip(this);
        });
      }
    }

    /**
     * 拠点チップ選択
     */
    function selectSiteChip(chip) {
      var chips = document.querySelectorAll('.filter-chips .chip');
      chips.forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      filters.site = chip.getAttribute('data-site');
      renderDeptList();
    }

    /**
     * 部署リストを描画
     */
    function renderDeptList() {
      var container = document.getElementById('dept-list');
      if (!container) return;

      var depts = App.getDepts();
      var filteredDepts = depts.filter(function(dept) {
        // 拠点フィルタ
        if (filters.site && dept.site !== filters.site) {
          return false;
        }
        // 検索フィルタ
        if (filters.search) {
          var name = (dept.name || '').toLowerCase();
          var note = (dept.note || '').toLowerCase();
          if (name.indexOf(filters.search) < 0 && note.indexOf(filters.search) < 0) {
            return false;
          }
        }
        return true;
      });

      if (filteredDepts.length === 0) {
        container.innerHTML = '<div class="empty-state">' +
          '<div class="empty-icon">🔍</div>' +
          '<p class="empty-text">該当する部署がありません</p>' +
          '</div>';
        return;
      }

      container.innerHTML = filteredDepts.map(function(dept) {
        var chatDisabled = !dept.chat_url && !dept.chat_space_id;
        var meetDisabled = !dept.meet_url && !dept.notify_space_id;

        return '<div class="dept-card" data-dept-id="' + App.escapeHtml(dept.dept_id) + '">' +
          '<div class="dept-info">' +
            '<div class="dept-name">' + App.escapeHtml(dept.name) + '</div>' +
            (dept.note ? '<div class="dept-description">' + App.escapeHtml(dept.note) + '</div>' : '') +
            '<span class="dept-location">' + App.escapeHtml(dept.site) + '</span>' +
          '</div>' +
          '<div class="dept-actions">' +
            '<button class="btn btn-chat" ' + (chatDisabled ? 'disabled title="準備中です"' : '') +
              ' onclick="Home.handleChat(\'' + App.escapeHtml(dept.dept_id) + '\')">' +
              '💬 Chat' +
            '</button>' +
            '<button class="btn btn-meet" ' + (meetDisabled ? 'disabled title="準備中です"' : '') +
              ' onclick="Home.handleMeet(\'' + App.escapeHtml(dept.dept_id) + '\')">' +
              '📹 Meet' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    /**
     * Chatボタン処理
     */
    function handleChat(deptId) {
      App.showLoading('Chatを開いています...');

      google.script.run
        .withSuccessHandler(function(result) {
          App.hideLoading();
          if (result.success) {
            App.showToast(result.deptName + ' のChatを開きます', 'success');
            window.open(result.chatUrl, '_blank');
          } else {
            App.showToast(result.error || 'Chatを開けませんでした', 'error');
          }
        })
        .withFailureHandler(function(error) {
          App.hideLoading();
          App.showToast('エラーが発生しました', 'error');
          console.error(error);
        })
        .openChat(deptId);
    }

    /**
     * Meetボタン処理
     */
    function handleMeet(deptId) {
      App.showLoading('Meetを作成しています...');

      google.script.run
        .withSuccessHandler(function(result) {
          App.hideLoading();
          if (result.success) {
            currentMeetData = result;

            // モーダルに情報を設定
            var deptNameEl = document.getElementById('meet-dept-name');
            if (deptNameEl) {
              deptNameEl.textContent = result.deptName;
            }
            document.getElementById('meet-modal').classList.remove('hidden');

            // 新しいタブでMeetを開く
            window.open(result.meetUrl, '_blank');
          } else {
            App.showToast(result.error || 'Meetを作成できませんでした', 'error');
          }
        })
        .withFailureHandler(function(error) {
          App.hideLoading();
          App.showToast('エラーが発生しました', 'error');
          console.error(error);
        })
        .createMeet(deptId, '');
    }

    /**
     * Meetモーダルを閉じる
     */
    function closeMeetModal() {
      document.getElementById('meet-modal').classList.add('hidden');
      currentMeetData = null;
    }

    /**
     * MeetからメモページへGO
     */
    function openMemoFromMeet() {
      if (currentMeetData) {
        App.navigateTo('memo', {
          event_id: currentMeetData.eventId,
          to: currentMeetData.deptId || ''
        });
      }
      closeMeetModal();
    }

    return {
      init: init,
      handleChat: handleChat,
      handleMeet: handleMeet,
      closeMeetModal: closeMeetModal,
      openMemoFromMeet: openMemoFromMeet
    };
  })();

  // DOM読み込み完了後に初期化
  document.addEventListener('DOMContentLoaded', Home.init);
  </script>
</body>
</html>
